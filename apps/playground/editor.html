<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WickScript Editor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e14;
        --panel: #11151d;
        --border: #1c2330;
        --text: #d1d4dc;
        --muted: #7d8598;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        font-size: 13px;
      }

      header span {
        color: var(--muted);
      }

      #editor {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header>wicklib <span>WickScript editor</span></header>
    <div id="editor"></div>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
