name: release

# Manual release workflow. Run it from the Actions tab after versioning.
#
# npm trusted publishing is configured on every package, but GitHub issues immutable OIDC
# subjects for repositories created after 2026-07-15 and npm does not support them yet
# (npm/cli#9969). Releases therefore use a granular NPM_TOKEN secret for now.
# When npm accepts the new subject format: delete NPM_TOKEN, remove the token step,
# restore `publishConfig.provenance` in the package manifests, and add `id-token: write`.
on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Verify npm auth
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: pnpm release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
