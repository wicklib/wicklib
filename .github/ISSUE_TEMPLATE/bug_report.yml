name: Bug report
description: Report a defect in Wicklib
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@wicklib/core 0.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps or a link to a reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Chrome 140, Node 24"
